<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엑셀 정리기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>엑셀 정리기</h1>
    <p class="note">파일은 이 브라우저 안에서만 읽고 계산합니다. 서버로 보내지 않습니다.</p>
  </header>

  <section id="s-drop">
    <h2>1. 파일 넣기</h2>
    <label id="drop" tabindex="0">
      <input id="file" type="file" accept=".xlsx,.xls,.csv" hidden>
      <strong>엑셀(.xlsx) 또는 CSV 파일을 여기로 끌어다 놓거나, 눌러서 고르세요</strong>
    </label>
    <div id="info" hidden></div>
  </section>

  <section id="s-rules" hidden>
    <h2>2. 처방</h2>
    <div id="rules-body"></div>
    <div id="rules-pick" hidden>
      <p>처방 파일(.json)을 직접 골라 올릴 수 있습니다.</p>
      <input id="rules-file" type="file" accept=".json,application/json">
    </div>
    <button id="run" type="button" hidden>규칙대로 정리</button>
  </section>

  <section id="s-result" hidden>
    <h2>3. 결과</h2>
    <div id="summary" class="cards"></div>
    <div id="downloads"></div>
    <div id="details"></div>
  </section>

  <section id="s-compare" hidden>
    <h2>4. 정답과 대조</h2>
    <p class="note">정답 파일은 이 사이트에 두지 않습니다. 내 컴퓨터에서 골라 주세요. (표시 칸은 문구가 아니라 «표시했는지»만 비교합니다.)</p>
    <input id="answer-file" type="file" accept=".xlsx,.xls,.csv">
    <div id="compare-out"></div>
  </section>
</main>
<script src="lib/xlsx.full.min.js"></script>
<script src="clean.js"></script>
<script src="app.js"></script>
</body>
</html>
